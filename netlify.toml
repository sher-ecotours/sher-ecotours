[build]
  publish = "."

# ── PWA: service worker must never be served from cache ──────────────────────
[[headers]]
  for = "/tms-app/service-worker.js"
  [headers.values]
    Cache-Control          = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/tms-app/"

# ── PWA: manifest and app shell — short cache so updates land quickly ─────────
[[headers]]
  for = "/tms-app/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/tms-app/index.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ── PWA: static assets (JS, CSS, icons) — cacheable ──────────────────────────
[[headers]]
  for = "/tms-app/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── /buyers — noindex + no-cache headers ─────────────────────────────────────
[[headers]]
  for = "/buyers/*"
  [headers.values]
    X-Robots-Tag    = "noindex, nofollow, noarchive"
    Cache-Control   = "no-store, must-revalidate"
    X-Frame-Options = "DENY"

[[redirects]]
  from   = "/buyers"
  to     = "/buyers/index.html"
  status = 200

# ── /investors — noindex + no-cache headers ──────────────────────────────────
[[headers]]
  for = "/investors/*"
  [headers.values]
    X-Robots-Tag  = "noindex, nofollow, noarchive"
    Cache-Control = "no-store, must-revalidate"
    X-Frame-Options = "DENY"

# ── /investors — explicit file serve (must precede catch-all) ─────────────────
[[redirects]]
  from   = "/investors"
  to     = "/investors/index.html"
  status = 200

# ── /command — serve the password-protected dashboard ────────────────────────
[[redirects]]
  from = "/command"
  to   = "/command/index.html"
  status = 200

# ── La Collection Papiyòt — proactive 301s for wrong names ──────────────────
# SPELLING: "Papiyòt" = butterfly in Saint Lucian Kwéyòl (CORRECT — use this).
#           "Papiyon" = moth in Saint Lucian Kwéyòl (WRONG — do not use).
# These are NOT interchangeable. Haitian/general Antillean Creole give "papiyon"
# for butterfly, but Saint Lucian Kwéyòl does not. Those sources are not
# authoritative here.
#
# "La Blanche de Cuba" / Cuban White (Ganyra menciae) retired at Rev B.
# "papiyot" (no accent) is an ASCII approximation of "Papiyòt"; catch it too.

# Guard: wrong name "papiyon" (moth) used as butterfly — send to buyers
[[redirects]]
  from   = "/la-collection-papiyon*"
  to     = "/buyers/"
  status = 301

[[redirects]]
  from   = "/cottages/papiyon*"
  to     = "/buyers/"
  status = 301

# Guard: unaccented ASCII approximation of correct name — send to buyers
[[redirects]]
  from   = "/cottages/papiyot*"
  to     = "/buyers/"
  status = 301

[[redirects]]
  from   = "/la-collection-papiyot*"
  to     = "/buyers/"
  status = 301

# Guard: retired species name — send to buyers
[[redirects]]
  from   = "/cottages/la-blanche-de-cuba"
  to     = "/buyers/"
  status = 301

[[redirects]]
  from   = "/cottage/la-blanche-de-cuba"
  to     = "/buyers/"
  status = 301

# ── Main site: catch-all for SPA-style direct links ──────────────────────────
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
