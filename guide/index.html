<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SHER Staff Portal</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#d4a843"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="SHER Staff"/>
  <link rel="apple-touch-icon" href="/icon-192.png"/>
</head>
<body>

  <!-- Login -->
  <div id="login-screen">
    <div class="login-box">
      <div class="login-eye">SHER ECO SANCTUARY</div>
      <h1 class="login-title">Staff Portal</h1>
      <p class="login-sub">Field staff access</p>
      <form id="login-form">
        <div class="field">
          <label>Email</label>
          <input type="email" id="l-email" autocomplete="email" required/>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="l-pass" autocomplete="current-password" required/>
        </div>
        <div id="login-error" class="error-msg" hidden></div>
        <button type="submit" id="login-btn">Sign in</button>
      </form>
    </div>
  </div>

  <!-- App -->
  <div id="app" hidden>

    <!-- Home screen -->
    <div id="screen-home">
      <header class="app-header">
        <div>
          <div class="header-eye">SHER ECO SANCTUARY</div>
          <div class="header-title">Staff Portal</div>
        </div>
        <button id="logout-btn">Sign out</button>
      </header>
      <div id="home-content"></div>
    </div>

    <!-- Form screen -->
    <div id="screen-form" hidden>
      <header class="form-header">
        <button id="back-btn">&#8592; Back</button>
        <div id="form-title"></div>
      </header>
      <div id="form-content"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
