<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SHER Partner Portal</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#d4a843"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="SHER Partners"/>
  <link rel="apple-touch-icon" href="/icon-192.png"/>
</head>
<body>

  <!-- Login -->
  <div id="login-screen">
    <div class="login-box">
      <div class="login-eye">SHER ECO SANCTUARY</div>
      <h1 class="login-title">Partner Portal</h1>
      <p class="login-sub">Hotel &amp; tour desk access</p>
      <form id="login-form">
        <div class="field">
          <label>Email</label>
          <input type="email" id="l-email" autocomplete="email" required/>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="l-pass" autocomplete="current-password" required/>
        </div>
        <div id="login-error" class="error-msg" hidden></div>
        <button type="submit" id="login-btn">Sign in</button>
      </form>
      <p style="text-align:center;margin-top:20px">
        <a href="#" id="forgot-link" style="font-size:14px;color:var(--muted);text-decoration:none">
          Forgot password?
        </a>
      </p>
    </div>
  </div>

  <!-- Forgot password -->
  <div id="forgot-screen" hidden>
    <div class="login-box">
      <div class="login-eye">SHER ECO SANCTUARY</div>
      <h1 class="login-title">Reset Password</h1>
      <p class="login-sub">We'll email you a reset link</p>
      <form id="forgot-form">
        <div class="field">
          <label>Email</label>
          <input type="email" id="f-email" autocomplete="email" required/>
        </div>
        <div id="forgot-msg" class="error-msg" hidden></div>
        <button type="submit" id="forgot-btn">Send reset link</button>
      </form>
      <p style="text-align:center;margin-top:20px">
        <a href="#" id="back-to-login" style="font-size:14px;color:var(--muted);text-decoration:none">
          Back to sign in
        </a>
      </p>
    </div>
  </div>

  <!-- New password (after clicking reset link) -->
  <div id="newpass-screen" hidden>
    <div class="login-box">
      <div class="login-eye">SHER ECO SANCTUARY</div>
      <h1 class="login-title">Set New Password</h1>
      <p class="login-sub">Choose a new password for your account</p>
      <form id="newpass-form">
        <div class="field">
          <label>New Password</label>
          <input type="password" id="np-pass" minlength="8" required/>
        </div>
        <div class="field">
          <label>Confirm Password</label>
          <input type="password" id="np-confirm" minlength="8" required/>
        </div>
        <div id="newpass-msg" class="error-msg" hidden></div>
        <button type="submit" id="newpass-btn">Set new password</button>
      </form>
    </div>
  </div>

  <!-- App -->
  <div id="app" hidden>

    <header class="app-header">
      <div>
        <div class="header-eye">SHER ECO SANCTUARY</div>
        <div class="header-title" id="header-title">Partner Portal</div>
      </div>
      <button id="logout-btn">Sign out</button>
    </header>

    <!-- Role badge -->
    <div id="role-badge-bar" class="role-badge-bar"></div>

    <!-- Tab bar (rendered by JS based on role) -->
    <nav class="tab-bar" id="tab-bar"></nav>

    <!-- Tab panels -->
    <div id="panel-experiences" class="tab-panel" hidden>
      <div class="panel-inner" id="content-experiences"></div>
    </div>

    <div id="panel-book" class="tab-panel" hidden>
      <div class="panel-inner" id="content-book"></div>
    </div>

    <!-- Partner: Bookings | Concierge: My Sales -->
    <div id="panel-bookings" class="tab-panel" hidden>
      <div class="panel-inner" id="content-bookings"></div>
    </div>

    <!-- Partner: Commission | Concierge: My Ripples -->
    <div id="panel-earn" class="tab-panel" hidden>
      <div class="panel-inner" id="content-earn"></div>
    </div>

    <!-- Partner: Payouts | Concierge: Redeem -->
    <div id="panel-action" class="tab-panel" hidden>
      <div class="panel-inner" id="content-action"></div>
    </div>

    <!-- Conservation Fund (partner only) -->
    <div id="panel-conservation" class="tab-panel" hidden>
      <div class="panel-inner" id="content-conservation"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
